<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniXL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pine: {
                            green: '#1e6b52',
                            hover: '#175440',
                            light: '#f2f8f6',
                            bg: '#eef4f2'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <div id="custom-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-start justify-center pt-16 p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <h3 id="modal-title" class="font-bold text-lg text-slate-800">Mensaje</h3>
            <p id="modal-message" class="text-sm text-slate-600"></p>
            <div id="modal-input-container" class="hidden">
                <input type="text" id="modal-input" class="w-full px-4 py-2.5 border border-slate-200 rounded-full focus:outline-none focus:border-pine-green text-sm bg-slate-50">
            </div>
            <div id="modal-sheets-container" class="hidden max-h-60 overflow-y-auto space-y-2 pr-1"></div>

            <div id="modal-operations-container" class="hidden space-y-2 pt-2">
                <!-- Franja de pesos (aparece al pulsar WAVG) -->
                <div id="weights-strip" class="hidden">
                    <div class="text-xs text-slate-500 mb-1.5 font-medium">Columna de peso:</div>
                    <div class="flex gap-1.5 overflow-x-auto pb-2 pt-1" id="weights-chips"></div>
                </div>

                <!-- Botones de operación -->
                <div class="grid grid-cols-2 gap-2">
                    <button data-op="SUM" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                        <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">Σ</div>
                        <span class="text-xs font-semibold text-slate-800">Suma</span>
                    </button>
                    <button data-op="COUNT" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                        <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">#</div>
                        <span class="text-xs font-semibold text-slate-800">Conteo</span>
                    </button>
                    <button data-op="MAX" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                        <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">↑</div>
                        <span class="text-xs font-semibold text-slate-800">Máximo</span>
                    </button>
                    <button data-op="MIN" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                        <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">↓</div>
                        <span class="text-xs font-semibold text-slate-800">Mínimo</span>
                    </button>
                    <button data-op="AVG" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                        <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">Ø</div>
                        <span class="text-xs font-semibold text-slate-800">Promedio</span>
                    </button>
                    <button data-op="WAVG" data-special="open-weights" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                        <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">Ω</div>
                        <span class="text-xs font-semibold text-slate-800">Pond.</span>
                    </button>
                </div>
            </div>

            <div id="modal-share-container" class="hidden grid grid-cols-2 gap-3 pt-2">
                <button id="btn-download-csv" class="flex flex-col items-center justify-center p-4 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-2">
                    <div class="w-12 h-12 rounded-xl bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Descargar CSV</span>
                </button>
                <button id="btn-share-message" class="flex flex-col items-center justify-center p-4 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-2">
                    <div class="w-12 h-12 rounded-xl bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Enviar por mensaje</span>
                </button>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button id="modal-cancel" class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-full transition hidden">Cancelar</button>
                <button id="modal-ok" class="px-6 py-2.5 text-sm font-medium text-white bg-pine-green hover:bg-pine-hover rounded-full shadow-sm transition">Aceptar</button>
            </div>
        </div>
    </div>

    <header class="bg-pine-green text-white px-4 py-2 flex items-center justify-between shadow-md z-40">
        <div class="flex items-center space-x-2">
            <span class="font-extrabold text-lg tracking-wider text-white px-1">TELARH</span>
        </div>
        <div class="absolute left-1/2 transform -translate-x-1/2">
            <div id="btn-sheets-manager" class="bg-white/15 px-3.5 py-1.5 rounded-full flex items-center space-x-2 border border-white/20 cursor-pointer hover:bg-white/25 transition shadow-sm">
                <svg class="w-4 h-4 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                <span id="current-sheet-label" class="font-semibold text-sm">Hoja 1</span>
                <svg class="w-3.5 h-3.5 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
            </div>
        </div>
        <div class="flex items-center space-x-1.5 sm:space-x-2">
            <!-- Modo normal: Compartir -->
            <button id="btn-open-share" class="w-9 h-9 sm:w-auto sm:px-3.5 sm:py-1.5 text-xs font-medium bg-white/10 hover:bg-white/20 rounded-full transition flex items-center justify-center space-x-1.5 border border-white/15 shadow-sm" title="Compartir">
                <svg class="w-4 h-4 sm:w-3.5 sm:h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                <span class="hidden sm:inline">Compartir</span>
            </button>

            <!-- Modo selección múltiple: X + Copiar/Cortar/Pegar -->
            <div id="selection-actions" class="hidden items-center space-x-1.5">
                <button id="btn-sel-close" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 transition flex items-center justify-center border border-white/15" title="Cancelar selección">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
                <button id="btn-sel-copy" class="px-4 h-9 rounded-full bg-white/10 hover:bg-white/20 transition flex items-center justify-center border border-white/15 text-xs font-medium">Copiar</button>
                <button id="btn-sel-cut"  class="px-4 h-9 rounded-full bg-white/10 hover:bg-white/20 transition flex items-center justify-center border border-white/15 text-xs font-medium">Cortar</button>
                <button id="btn-sel-paste" class="px-4 h-9 rounded-full bg-white/10 hover:bg-white/20 transition flex items-center justify-center border border-white/15 text-xs font-medium">Pegar</button>
            </div>
        </div>
    </header>

    <div id="grid-container" class="flex-1 overflow-auto bg-slate-200 relative select-none">
        <table id="spreadsheet-table" class="border-collapse bg-white shadow-sm"></table>
    </div>

    <script src="js/lz-string.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/state.js"></script>
    <script src="js/selection.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/cells.js"></script>
    <script src="js/columns.js"></script>
    <script src="js/clipboard.js"></script>
    <script src="js/formulas.js"></script>
    <script src="js/sheets.js"></script>
    <script src="js/sharing.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
