    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .cell-container { position: relative; width: 100%; height: 100%; }
        .cell-input {
            width: 100%; height: 100%; border: none; outline: none;
            background: transparent; padding: 0.25rem 2rem 0.25rem 0.5rem;
            font-size: 0.875rem; color: #1e293b;
        }
        .cell-selected { box-shadow: inset 0 0 0 2px #1e6b52 !important; background-color: #f2f8f6 !important; }
        .keyboard-toggle-btn {
            position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
            width: 24px; height: 20px; border-radius: 4px;
            background-color: transparent; color: #94a3b8; font-size: 10px; font-weight: 600;
            display: none; align-items: center; justify-content: center; cursor: pointer;
            z-index: 5; transition: all 0.2s; letter-spacing: -0.5px;
        }
        .keyboard-toggle-btn.active-numeric { color: #1e6b52; background-color: rgba(30, 107, 82, 0.08); font-weight: 700; }
        .keyboard-toggle-btn:hover { color: #475569; background-color: rgba(0, 0, 0, 0.04); }
        .cell-selected .keyboard-toggle-btn { display: flex; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        @media (prefers-color-scheme: dark) {
            body, .bg-slate-100 { background-color: #0f172a !important; color: #e2e8f0; }
            .bg-slate-200, .bg-slate-300 { background-color: #1e293b !important; }
            .bg-white { background-color: #111827 !important; }
            .bg-slate-50, .hover\:bg-slate-50:hover { background-color: #1f2937 !important; }
            .hover\:bg-slate-100:hover { background-color: #273449 !important; }
            .bg-pine-light, .hover\:bg-pine-light:hover, .hover\:bg-pine-light\/80:hover { background-color: #12302a !important; }
            .border-slate-100, .border-slate-200, .border-slate-300 { border-color: #334155 !important; }
            .text-slate-800, .text-slate-700, .text-slate-600 { color: #e2e8f0 !important; }
            .text-slate-500, .text-slate-400 { color: #94a3b8 !important; }
            .text-pine-green { color: #4ade9b !important; }
            .group:hover .group-hover\:text-white { color: #fff !important; }
            .cell-input { color: #e2e8f0; }
            .cell-selected { background-color: #12302a !important; box-shadow: inset 0 0 0 2px #4ade9b !important; }
            .keyboard-toggle-btn.active-numeric { color: #4ade9b; background-color: rgba(74,222,155,.12); }
            .bg-pine-green { background-color: #14503d !important; }
            input { color-scheme: dark; }
        }

    <script>
        function showModal(title, message, options = {}) {
            const { showInput = false, showSheetsList = false, showShareOptions = false, showOperationsOptions = false, callback = null, defaultValue = '' } = options;
            const modal = document.getElementById('custom-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalMsg = document.getElementById('modal-message');
            const inputContainer = document.getElementById('modal-input-container');
            const inputField = document.getElementById('modal-input');
            const sheetsContainer = document.getElementById('modal-sheets-container');
            const operationsContainer = document.getElementById('modal-operations-container');
            const shareContainer = document.getElementById('modal-share-container');
            const btnOk = document.getElementById('modal-ok');
            const btnCancel = document.getElementById('modal-cancel');

            btnOk.innerText = 'Aceptar';
            modalTitle.innerText = title;
            modalMsg.innerText = message;
            inputField.value = defaultValue;

            if (showInput || showSheetsList || showShareOptions || showOperationsOptions || callback) {
                btnCancel.classList.remove('hidden');
            } else {
                btnCancel.classList.add('hidden');
            }

            if (showInput) inputContainer.classList.remove('hidden');
            else inputContainer.classList.add('hidden');

            if (showSheetsList) sheetsContainer.classList.remove('hidden');
            else sheetsContainer.classList.add('hidden');

            if (showOperationsOptions) { operationsContainer.classList.remove('hidden'); btnOk.classList.add('hidden'); }
            else { operationsContainer.classList.add('hidden'); btnOk.classList.remove('hidden'); }

            if (showShareOptions) { shareContainer.classList.remove('hidden'); btnOk.classList.add('hidden'); }
            else { shareContainer.classList.add('hidden'); btnOk.classList.remove('hidden'); }

            modal.classList.remove('hidden');
            if (showInput) setTimeout(() => { inputField.focus(); inputField.select(); }, 50);

            const newOk = btnOk.cloneNode(true);
            const newCancel = btnCancel.cloneNode(true);
            btnOk.parentNode.replaceChild(newOk, btnOk);
            btnCancel.parentNode.replaceChild(newCancel, btnCancel);

            newOk.addEventListener('click', () => {
                modal.classList.add('hidden');
                if (callback) {
                    if (showInput) callback(inputField.value);
                    else callback(true);
                }
            });

            newCancel.addEventListener('click', () => {
                modal.classList.add('hidden');
                if (callback && (showInput || showSheetsList || showShareOptions || showOperationsOptions)) callback(null);
                else if (callback) callback(false);
            });
        }

        class ExcelGridApp {
            constructor(cols = 20, rows = 40) {
                this.cols = cols;
                this.rows = rows;
                this.selectedRow = 0;
                this.selectedCol = 0;
                this.loadState();
                this.processIncomingHash(); // Antes de initGrid
                this.initGrid();
                this.initEvents();
            }

            getStorageKey() {
                return 'miniXL_data_v1';
            }

            loadState() {
                let saved = null;
                try { saved = JSON.parse(localStorage.getItem(this.getStorageKey())); } catch (e) {}
                if (!saved || !saved.sheets || !saved.sheets.length) {
                    saved = {
                        sheets: [{ id: 'sheet_1', name: 'Hoja 1', data: {}, operations: {}, keyboardMode: 'text' }],
                        activeSheetId: 'sheet_1'
                    };
                }
                this.sheets = saved.sheets;
                this.activeSheetId = saved.activeSheetId;
                if (!this.sheets.some(s => s.id === this.activeSheetId)) {
                    this.activeSheetId = this.sheets[0].id;
                }
            }

            saveState() {
                try {
                    localStorage.setItem(this.getStorageKey(), JSON.stringify({
                        sheets: this.sheets,
                        activeSheetId: this.activeSheetId
                    }));
                } catch (e) {}
            }

            getCurrentSheet() {
                return this.sheets.find(s => s.id === this.activeSheetId) || this.sheets[0];
            }

            getColName(index) {
                let name = '';
                let num = index + 1;
                while (num > 0) {
                    let modulo = (num - 1) % 26;
                    name = String.fromCharCode(65 + modulo) + name;
                    num = Math.floor((num - modulo) / 26);
                }
                return name;
            }

            getCellKey(row, col) {
                return `${this.getColName(col)}${row + 1}`;
            }

            calculateColumnSummary(colIndex) {
                const sheet = this.getCurrentSheet();
                const op = sheet.operations[colIndex] || 'SUM';
                let values = [];
                for (let r = 0; r < this.rows; r++) {
                    const key = this.getCellKey(r, colIndex);
                    const val = sheet.data[key];
                    if (val !== undefined && val !== '' && !isNaN(val)) {
                        values.push(parseFloat(val));
                    }
                }
                if (values.length === 0) return '-';
                switch(op) {
                    case 'SUM': return values.reduce((a, b) => a + b, 0).toLocaleString();
                    case 'AVG': return (values.reduce((a, b) => a + b, 0) / values.length).toFixed(2);
                    case 'MAX': return Math.max(...values).toLocaleString();
                    case 'MIN': return Math.min(...values).toLocaleString();
                    case 'COUNT': return values.length;
                    default: return '-';
                }
            }

            toggleKeyboardType(r, c, event) {
                event.stopPropagation();
                const sheet = this.getCurrentSheet();
                sheet.keyboardMode = sheet.keyboardMode === 'numeric' ? 'text' : 'numeric';
                const numeric = sheet.keyboardMode === 'numeric';
                this.saveState();
                document.querySelectorAll('.cell-input').forEach(i => i.setAttribute('inputmode', numeric ? 'decimal' : 'text'));
                document.querySelectorAll('.keyboard-toggle-btn').forEach(btn => btn.classList.toggle('active-numeric', numeric));
                const input = document.getElementById(`cell_${r}_${c}`);
                if (input) { input.blur(); setTimeout(() => input.focus(), 30); }
            }

                const sheet = this.getCurrentSheet();
                const label = document.getElementById('current-sheet-label');
                if (label) label.innerText = sheet.name;
            }
