<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Hoja de Cálculo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pine: {
                            green: '#1e6b52',
                            hover: '#175440',
                            light: '#f2f8f6',
                            bg: '#eef4f2'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .cell-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .cell-input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 0.25rem 2rem 0.25rem 0.5rem;
            font-size: 0.875rem;
            color: #1e293b;
        }
        .cell-selected {
            box-shadow: inset 0 0 0 2px #1e6b52 !important;
            background-color: #f2f8f6 !important;
        }
        .keyboard-toggle-btn {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 20px;
            border-radius: 4px;
            background-color: transparent;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            transition: all 0.2s;
            letter-spacing: -0.5px;
        }
        .keyboard-toggle-btn.active-numeric {
            color: #1e6b52;
            background-color: rgba(30, 107, 82, 0.08);
            font-weight: 700;
        }
        .keyboard-toggle-btn:hover {
            color: #475569;
            background-color: rgba(0, 0, 0, 0.04);
        }
        .cell-selected .keyboard-toggle-btn {
            display: flex;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        @media (prefers-color-scheme: dark) {
            body, .bg-slate-100 { background-color: #0f172a !important; color: #e2e8f0; }
            .bg-slate-200, .bg-slate-300 { background-color: #1e293b !important; }
            .bg-white { background-color: #111827 !important; }
            .bg-slate-50, .hover\:bg-slate-50:hover { background-color: #1f2937 !important; }
            .hover\:bg-slate-100:hover { background-color: #273449 !important; }
            .bg-pine-light, .hover\:bg-pine-light:hover, .hover\:bg-pine-light\/80:hover { background-color: #12302a !important; }
            .border-slate-100, .border-slate-200, .border-slate-300 { border-color: #334155 !important; }
            .text-slate-800, .text-slate-700, .text-slate-600 { color: #e2e8f0 !important; }
            .text-slate-500, .text-slate-400 { color: #94a3b8 !important; }
            .text-pine-green { color: #4ade9b !important; }
            .group:hover .group-hover\:text-white { color: #fff !important; }
            .cell-input { color: #e2e8f0; }
            .cell-selected { background-color: #12302a !important; box-shadow: inset 0 0 0 2px #4ade9b !important; }
            .keyboard-toggle-btn.active-numeric { color: #4ade9b; background-color: rgba(74,222,155,.12); }
            .bg-pine-green { background-color: #14503d !important; }
            input { color-scheme: dark; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <div id="custom-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-start justify-center pt-16 p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <h3 id="modal-title" class="font-bold text-lg text-slate-800">Mensaje</h3>
            <p id="modal-message" class="text-sm text-slate-600"></p>
            <div id="modal-input-container" class="hidden">
                <input type="text" id="modal-input" class="w-full px-4 py-2.5 border border-slate-200 rounded-full focus:outline-none focus:border-pine-green text-sm bg-slate-50">
            </div>
            <div id="modal-sheets-container" class="hidden max-h-60 overflow-y-auto space-y-2 pr-1">
                <!-- Se llena dinámicamente con las hojas guardadas -->
            </div>
            <div id="modal-operations-container" class="hidden grid grid-cols-2 gap-2 pt-2">
                <button onclick="gridApp.selectColumnOperationModal('SUM')" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                    <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">Σ</div>
                    <span class="text-xs font-semibold text-slate-800">Suma</span>
                </button>
                <button onclick="gridApp.selectColumnOperationModal('AVG')" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                    <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">Ø</div>
                    <span class="text-xs font-semibold text-slate-800">Promedio</span>
                </button>
                <button onclick="gridApp.selectColumnOperationModal('MAX')" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                    <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">↑</div>
                    <span class="text-xs font-semibold text-slate-800">Máximo</span>
                </button>
                <button onclick="gridApp.selectColumnOperationModal('MIN')" class="flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                    <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">↓</div>
                    <span class="text-xs font-semibold text-slate-800">Mínimo</span>
                </button>
                <button onclick="gridApp.selectColumnOperationModal('COUNT')" class="col-span-2 flex flex-col items-center justify-center p-3 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-1">
                    <div class="w-8 h-8 rounded-lg bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition font-bold text-sm">#</div>
                    <span class="text-xs font-semibold text-slate-800">Conteo</span>
                </button>
            </div>
            <div id="modal-share-container" class="hidden grid grid-cols-2 gap-3 pt-2">
                <button onclick="gridApp.downloadCSV()" class="flex flex-col items-center justify-center p-4 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-2">
                    <div class="w-12 h-12 rounded-xl bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Descargar CSV</span>
                </button>
                <button onclick="gridApp.shareAppCopy()" class="flex flex-col items-center justify-center p-4 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-pine-light hover:border-pine-green transition group text-center space-y-2">
                    <div class="w-12 h-12 rounded-xl bg-pine-green/10 text-pine-green flex items-center justify-center group-hover:bg-pine-green group-hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    </div>
                    <span class="text-xs font-semibold text-slate-700">Enviar App con Hoja</span>
                </button>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
                <button id="modal-cancel" class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-full transition hidden">Cancelar</button>
                <button id="modal-ok" class="px-6 py-2.5 text-sm font-medium text-white bg-pine-green hover:bg-pine-hover rounded-full shadow-sm transition">Aceptar</button>
            </div>
        </div>
    </div>

    <header class="bg-pine-green text-white px-4 py-2 flex items-center justify-between shadow-md z-40">
        <div class="flex items-center space-x-2">
            <span class="font-extrabold text-lg tracking-wider text-white px-1">TELARH</span>
        </div>
        <div class="absolute left-1/2 transform -translate-x-1/2">
            <div class="bg-white/15 px-3.5 py-1.5 rounded-full flex items-center space-x-2 border border-white/20 cursor-pointer hover:bg-white/25 transition shadow-sm" onclick="gridApp.openSheetsManagerModal()">
                <svg class="w-4 h-4 text-white/90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                <span id="current-sheet-label" class="font-semibold text-sm">Hoja 1</span>
                <svg class="w-3.5 h-3.5 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
            </div>
        </div>
        <div class="flex items-center space-x-1.5 sm:space-x-2">
            <button onclick="gridApp.openShareModal()" class="w-9 h-9 sm:w-auto sm:px-3.5 sm:py-1.5 text-xs font-medium bg-white/10 hover:bg-white/20 rounded-full transition flex items-center justify-center space-x-1.5 border border-white/15 shadow-sm" title="Compartir">
                <svg class="w-4 h-4 sm:w-3.5 sm:h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                <span class="hidden sm:inline">Compartir</span>
            </button>
        </div>
    </header>

    <div id="grid-container" class="flex-1 overflow-auto bg-slate-200 relative select-none">
        <table id="spreadsheet-table" class="border-collapse bg-white shadow-sm">
            <!-- Se llena dinámicamente -->
        </table>
    </div>

    <script>
        function showModal(title, message, options = {}) {
            const { showInput = false, showSheetsList = false, showShareOptions = false, showOperationsOptions = false, callback = null } = options;
            const modal = document.getElementById('custom-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalMsg = document.getElementById('modal-message');
            const inputContainer = document.getElementById('modal-input-container');
            const inputField = document.getElementById('modal-input');
            const sheetsContainer = document.getElementById('modal-sheets-container');
            const operationsContainer = document.getElementById('modal-operations-container');
            const shareContainer = document.getElementById('modal-share-container');
            const btnOk = document.getElementById('modal-ok');
            const btnCancel = document.getElementById('modal-cancel');

            btnOk.innerText = 'Aceptar';
            modalTitle.innerText = title;
            modalMsg.innerText = message;
            inputField.value = '';
            
            if (showInput || showSheetsList || showShareOptions || showOperationsOptions || callback) {
                btnCancel.classList.remove('hidden');
            } else {
                btnCancel.classList.add('hidden');
            }

            if (showInput) inputContainer.classList.remove('hidden');
            else inputContainer.classList.add('hidden');

            if (showSheetsList) sheetsContainer.classList.remove('hidden');
            else sheetsContainer.classList.add('hidden');

            if (showOperationsOptions) {
                operationsContainer.classList.remove('hidden');
                btnOk.classList.add('hidden');
            } else {
                operationsContainer.classList.add('hidden');
                btnOk.classList.remove('hidden');
            }

            if (showShareOptions) {
                shareContainer.classList.remove('hidden');
                btnOk.classList.add('hidden');
            } else {
                shareContainer.classList.add('hidden');
                btnOk.classList.remove('hidden');
            }

            modal.classList.remove('hidden');
            if (showInput) setTimeout(() => inputField.focus(), 50);

            const newOk = btnOk.cloneNode(true);
            const newCancel = btnCancel.cloneNode(true);
            btnOk.parentNode.replaceChild(newOk, btnOk);
            btnCancel.parentNode.replaceChild(newCancel, btnCancel);

            newOk.addEventListener('click', () => {
                modal.classList.add('hidden');
                if (callback) {
                    if (showInput) callback(inputField.value);
                    else callback(true);
                }
            });

            newCancel.addEventListener('click', () => {
                modal.classList.add('hidden');
                if (callback && (showInput || showSheetsList || showShareOptions || showOperationsOptions)) callback(null);
                else if (callback) callback(false);
            });
        }

        class ExcelGridApp {
            constructor(cols = 20, rows = 40) {
                this.cols = cols;
                this.rows = rows;
                this.selectedRow = 0;
                this.selectedCol = 0;
                
                this.loadState();
                this.initGrid();
                this.initEvents();
            }

            getStorageKey() {
                return window.__HOJA_ACTIVA__
                    ? 'telarh_compartida_' + (window.__HOJA_ACTIVA__.id || 'x')
                    : 'mini_excel_multisheet_data_v8';
            }

            loadState() {
                let saved = null;
                try { saved = JSON.parse(localStorage.getItem(this.getStorageKey())); } catch (e) {}
                if (!saved && window.__HOJA_ACTIVA__) {
                    const p = window.__HOJA_ACTIVA__;
                    saved = {
                        sheets: [{ id: p.id || 'sheet_shared', name: p.name || 'Hoja compartida',
                                   data: p.data || {}, operations: p.operations || {}, keyboardTypes: p.keyboardTypes || {} }],
                        activeSheetId: p.id || 'sheet_shared'
                    };
                }
                if (!saved || !saved.sheets || !saved.sheets.length) {
                    saved = {
                        sheets: [{ id: 'sheet_1', name: 'Hoja 1', data: {}, operations: {}, keyboardTypes: {} }],
                        activeSheetId: 'sheet_1'
                    };
                }
                this.sheets = saved.sheets;
                this.activeSheetId = saved.activeSheetId;
                if (!this.sheets.some(s => s.id === this.activeSheetId)) {
                    this.activeSheetId = this.sheets[0].id;
                }
            }

            saveState() {
                try {
                    localStorage.setItem(this.getStorageKey(), JSON.stringify({
                        sheets: this.sheets,
                        activeSheetId: this.activeSheetId
                    }));
                } catch (e) {}
            }

            getCurrentSheet() {
                return this.sheets.find(s => s.id === this.activeSheetId) || this.sheets[0];
            }

            getColName(index) {
                let name = '';
                let num = index + 1;
                while (num > 0) {
                    let modulo = (num - 1) % 26;
                    name = String.fromCharCode(65 + modulo) + name;
                    num = Math.floor((num - modulo) / 26);
                }
                return name;
            }

            getCellKey(row, col) {
                return `${this.getColName(col)}${row + 1}`;
            }

            calculateColumnSummary(colIndex) {
                const sheet = this.getCurrentSheet();
                const op = sheet.operations[colIndex] || 'SUM';
                let values = [];
                for (let r = 0; r < this.rows; r++) {
                    const key = this.getCellKey(r, colIndex);
                    const val = sheet.data[key];
                    if (val !== undefined && val !== '' && !isNaN(val)) {
                        values.push(parseFloat(val));
                    }
                }

                if (values.length === 0) return '-';

                switch(op) {
                    case 'SUM':
                        return values.reduce((a, b) => a + b, 0).toLocaleString();
                    case 'AVG':
                        return (values.reduce((a, b) => a + b, 0) / values.length).toFixed(2);
                    case 'MAX':
                        return Math.max(...values).toLocaleString();
                    case 'MIN':
                        return Math.min(...values).toLocaleString();
                    case 'COUNT':
                        return values.length;
                    default:
                        return '-';
                }
            }

            initGrid() {
                this.updateSheetSelectorLabel();
                const table = document.getElementById('spreadsheet-table');
                const sheet = this.getCurrentSheet();

                let html = '';

                html += '<thead>';
                
                // Fila de Sumatoria (sticky top 0)
                html += '<tr>';
                html += '<th class="sticky top-0 left-0 z-30 border border-slate-300 w-12 h-9 text-xs text-slate-600 font-bold text-center select-none bg-slate-200">Σ</th>';
                
                for (let c = 0; c < this.cols; c++) {
                    const currentOp = sheet.operations[c] || 'SUM';
                    const summaryVal = this.calculateColumnSummary(c);
                    
                    const opNames = { 'SUM': 'Suma', 'AVG': 'Promedio', 'MAX': 'Máximo', 'MIN': 'Mínimo', 'COUNT': 'Conteo' };
                    const opTitle = opNames[currentOp] || 'Suma';

                    html += `
                        <th class="sticky top-0 z-20 border border-slate-300 h-9 px-2 text-xs font-medium text-slate-700 text-center select-none min-w-[100px] max-w-[100px] w-[100px] bg-slate-50">
                            <div class="flex flex-col items-center justify-center h-full cursor-pointer hover:bg-slate-100 transition rounded" onclick="gridApp.openOperationModal(${c})" title="Haz clic para cambiar operación">
                                <span class="text-[10px] text-pine-green font-bold truncate w-full">${opTitle}</span>
                                <div class="text-pine-green font-bold text-sm truncate w-full" id="summary_col_${c}">${summaryVal}</div>
                            </div>
                        </th>
                    `;
                }
                html += '</tr>';

                // Fila de letras de columnas A, B, C... (sticky top 9)
                html += '<tr>';
                html += '<th class="sticky top-9 left-0 z-30 border border-slate-300 w-12 h-8 text-xs text-slate-500 font-semibold text-center select-none bg-slate-100">#</th>';
                
                for (let c = 0; c < this.cols; c++) {
                    html += `
                        <th class="sticky top-9 z-20 border border-slate-300 h-8 px-2 text-xs font-semibold text-center select-none min-w-[100px] max-w-[100px] w-[100px] bg-slate-100">
                            <div class="flex items-center justify-center space-x-1">
                                <span class="text-slate-600">${this.getColName(c)}</span>
                            </div>
                        </th>
                    `;
                }
                html += '</tr>';
                html += '</thead>';

                html += '<tbody>';
                for (let r = 0; r < this.rows; r++) {
                    html += `<tr>`;
                    // Número de fila fijo a la izquierda (sticky left-0 z-10)
                    html += `<th class="sticky left-0 z-10 border border-slate-300 w-12 h-8 text-xs text-slate-500 font-semibold text-center select-none bg-slate-100">${r + 1}</th>`;
                    
                    for (let c = 0; c < this.cols; c++) {
                        const cellKey = this.getCellKey(r, c);
                        const val = sheet.data[cellKey] || '';
                        const isNumeric = sheet.keyboardMode === 'numeric';
                        const inputType = 'text';
                        const toggleClass = isNumeric ? 'keyboard-toggle-btn active-numeric' : 'keyboard-toggle-btn';

                        html += `
                            <td class="border border-slate-300 h-8 p-0 relative bg-white hover:bg-slate-50 transition-colors min-w-[100px] max-w-[100px] w-[100px]" data-row="${r}" data-col="${c}">
                                <div class="cell-container">
                                    <input type="${inputType}" inputmode="${isNumeric ? 'decimal' : 'text'}" class="cell-input" value="${val}" 
                                        data-row="${r}" data-col="${c}" 
                                        id="cell_${r}_${c}" enterkeyhint="next" tabindex="${c * this.rows + r + 1}">
                                    <button type="button" class="${toggleClass}" onclick="gridApp.toggleKeyboardType(${r}, ${c}, event)" title="Cambiar teclado">123</button>
                                </div>
                            </td>
                        `;
                    }
                    html += `</tr>`;
                }
                html += '</tbody>';

                table.innerHTML = html;
            }

            toggleKeyboardType(r, c, event) {
                event.stopPropagation();
                const sheet = this.getCurrentSheet();
                sheet.keyboardMode = sheet.keyboardMode === 'numeric' ? 'text' : 'numeric';
                const numeric = sheet.keyboardMode === 'numeric';
                this.saveState();

                // Actualiza todas las celdas sin re-renderizar
                document.querySelectorAll('.cell-input').forEach(i => i.setAttribute('inputmode', numeric ? 'decimal' : 'text'));
                document.querySelectorAll('.keyboard-toggle-btn').forEach(btn => btn.classList.toggle('active-numeric', numeric));

                // Refresca el teclado en la celda activa
                const input = document.getElementById(`cell_${r}_${c}`);
                if (input) { input.blur(); setTimeout(() => input.focus(), 30); }
            }

            updateSheetSelectorLabel() {
                const sheet = this.getCurrentSheet();
                const label = document.getElementById('current-sheet-label');
                if (label) {
                    label.innerText = sheet.name;
                }
            }

            openSheetsManagerModal() {
                const modal = document.getElementById('custom-modal');
                const modalTitle = document.getElementById('modal-title');
                const modalMsg = document.getElementById('modal-message');
                const inputContainer = document.getElementById('modal-input-container');
                const sheetsContainer = document.getElementById('modal-sheets-container');
                const operationsContainer = document.getElementById('modal-operations-container');
                const shareContainer = document.getElementById('modal-share-container');
                const btnOk = document.getElementById('modal-ok');
                const btnCancel = document.getElementById('modal-cancel');

                modalTitle.innerText = "Gestión de Hojas";
                modalMsg.innerText = "Selecciona una hoja o crea una nueva:";
                
                inputContainer.classList.add('hidden');
                shareContainer.classList.add('hidden');
                operationsContainer.classList.add('hidden');
                sheetsContainer.classList.remove('hidden');
                btnCancel.classList.add('hidden');
                btnOk.classList.remove('hidden');
                btnOk.innerText = "Cerrar";

                this.renderSheetsListInModal();

                modal.classList.remove('hidden');

                const newOk = btnOk.cloneNode(true);
                btnOk.parentNode.replaceChild(newOk, btnOk);

                newOk.addEventListener('click', () => {
                    modal.classList.add('hidden');
                });
            }

            renderSheetsListInModal() {
                const sheetsContainer = document.getElementById('modal-sheets-container');
                
                let html = `
                    <div class="flex items-center space-x-2.5 p-2.5 rounded-2xl border border-dashed border-pine-green/60 bg-pine-light hover:bg-pine-light/80 transition cursor-pointer mb-2" onclick="gridApp.createNewSheetFromModal()">
                        <div class="w-7 h-7 rounded-full bg-pine-green text-white flex items-center justify-center font-bold text-sm">+</div>
                        <span class="text-sm font-semibold text-pine-green">Nueva Hoja</span>
                    </div>
                `;

                html += this.sheets.map(s => {
                    const isActive = s.id === this.activeSheetId;
                    return `
                        <div class="flex items-center justify-between p-2.5 rounded-2xl border ${isActive ? 'border-pine-green bg-pine-light' : 'border-slate-100 bg-slate-50 hover:bg-slate-100'} transition">
                            <div class="flex items-center space-x-2.5 cursor-pointer flex-1" onclick="gridApp.switchToSheetFromModal('${s.id}')">
                                <div class="w-2.5 h-2.5 rounded-full ${isActive ? 'bg-pine-green' : 'bg-slate-300'}"></div>
                                <span class="text-sm font-medium ${isActive ? 'text-pine-green font-bold' : 'text-slate-700'}">${s.name}</span>
                            </div>
                            <button onclick="event.stopPropagation(); gridApp.deleteSheetById('${s.id}')" class="w-8 h-8 rounded-full hover:bg-red-100 flex items-center justify-center text-slate-400 hover:text-red-600 transition" title="Eliminar hoja">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    `;
                }).join('');

                sheetsContainer.innerHTML = html;
            }

            switchToSheetFromModal(sheetId) {
                this.activeSheetId = sheetId;
                this.saveState();
                this.initGrid();
                this.initEvents();
                document.getElementById('custom-modal').classList.add('hidden');
            }

            deleteSheetById(sheetId) {
                if (this.sheets.length <= 1) {
                    showModal("Aviso", "No puedes eliminar la única hoja existente.");
                    return;
                }
                this.sheets = this.sheets.filter(s => s.id !== sheetId);
                if (this.activeSheetId === sheetId) {
                    this.activeSheetId = this.sheets[0].id;
                }
                this.saveState();
                this.initGrid();
                this.initEvents();
                this.renderSheetsListInModal();
                document.getElementById('custom-modal').classList.remove('hidden');
            }

            createNewSheet() {
                showModal("Nueva hoja", "Nombre de la nueva hoja:", {
                    showInput: true,
                    callback: (sheetName) => {
                        if (sheetName && sheetName.trim() !== '') {
                            const newId = 'sheet_' + Date.now();
                            this.sheets.push({
                                id: newId,
                                name: sheetName.trim(),
                                data: {},
                                operations: {},
                                keyboardTypes: {}
                            });
                            this.activeSheetId = newId;
                            this.saveState();
                            this.initGrid();
                            this.initEvents();
                        }
                    }
                });
            }

            createNewSheetFromModal() {
                document.getElementById('custom-modal').classList.add('hidden');
                setTimeout(() => {
                    this.createNewSheet();
                }, 100);
            }

            openOperationModal(colIndex) {
                this.activeOperationCol = colIndex;
                const colName = this.getColName(colIndex);
                showModal("Seleccionar operación", `Elige la agregación para la columna ${colName}:`, {
                    showOperationsOptions: true
                });
            }

            selectColumnOperationModal(op) {
                document.getElementById('custom-modal').classList.add('hidden');
                if (this.activeOperationCol !== undefined) {
                    const sheet = this.getCurrentSheet();
                    sheet.operations[this.activeOperationCol] = op;
                    this.saveState();
                    this.initGrid();
                    this.initEvents();
                }
            }

            updateColumnSummary(colIndex) {
                const summaryVal = this.calculateColumnSummary(colIndex);
                const summaryEl = document.getElementById(`summary_col_${colIndex}`);
                if (summaryEl) {
                    summaryEl.innerText = summaryVal;
                }
            }

            initEvents() {
                const inputs = document.querySelectorAll('.cell-input');

                inputs.forEach(input => {
                    const r = parseInt(input.dataset.row);
                    const c = parseInt(input.dataset.col);

                    input.addEventListener('focus', (e) => {
                        this.selectCell(r, c, false);
                    });

                    input.addEventListener('input', (e) => {
                        const sheet = this.getCurrentSheet();
                        const cellKey = this.getCellKey(r, c);
                        const value = e.target.value;
                        if (value === '') {
                            delete sheet.data[cellKey];
                        } else {
                            sheet.data[cellKey] = value;
                        }
                        this.saveState();
                        this.updateColumnSummary(c);
                    });

                    input.addEventListener('keydown', (e) => {
                        let targetR = r;
                        let targetC = c;

                        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.keyCode === 13) {
                            targetR = Math.min(this.rows - 1, r + 1);
                            e.preventDefault();
                        } else if (e.key === 'ArrowUp') {
                            targetR = Math.max(0, r - 1);
                            e.preventDefault();
                        } else if (e.key === 'ArrowRight' && input.selectionEnd === input.value.length) {
                            targetC = Math.min(this.cols - 1, c + 1);
                            e.preventDefault();
                        } else if (e.key === 'ArrowLeft' && input.selectionStart === 0) {
                            targetC = Math.max(0, c - 1);
                            e.preventDefault();
                        } else if (e.key === 'Tab') {
                            targetR = Math.min(this.rows - 1, r + 1);
                            e.preventDefault();
                        }

                        if (targetR !== r || targetC !== c) {
                            this.selectCell(targetR, targetC, true);
                        }
                    });
                });
            }

            selectCell(r, c, focusInput = true) {
                document.querySelectorAll('td').forEach(td => td.classList.remove('cell-selected'));

                this.selectedRow = r;
                this.selectedCol = c;

                const input = document.getElementById(`cell_${r}_${c}`);
                if (input) {
                    const td = input.parentElement.parentElement;
                    td.classList.add('cell-selected');
                    
                    const container = document.getElementById('grid-container');
                    const tdRect = td.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();

                    const targetLeft = container.scrollLeft + (tdRect.left - containerRect.left) - (containerRect.width / 2) + (tdRect.width / 2);
                    const targetTop = container.scrollTop + (tdRect.top - containerRect.top) - (containerRect.height / 2) + (tdRect.height / 2);

                    container.scrollTo({
                        left: Math.max(0, targetLeft),
                        top: Math.max(0, targetTop),
                        behavior: 'smooth'
                    });

                    if (focusInput) {
                        setTimeout(() => {
                            input.focus();
                            input.select();
                        }, 50);
                    }
                }
            }

            openShareModal() {
                showModal("Compartir", "Elige el formato con el que deseas compartir o descargar:", {
                    showShareOptions: true
                });
            }

            async saveFile(filename, data, mime) {
                try {
                    if (window.claude && window.claude.use) {
                        const dl = await window.claude.use("downloads");
                        if (dl) {
                            await dl.save({ filename, data: new Blob([data], { type: mime }) });
                            return true;
                        }
                    }
                } catch (e) { if (e && e.code === 'declined') return true; }
                const url = URL.createObjectURL(new Blob([data], { type: mime }));
                const a = document.createElement('a');
                a.href = url; a.download = filename; a.click();
                URL.revokeObjectURL(url);
                return true;
            }

            downloadCSV() {
                document.getElementById('custom-modal').classList.add('hidden');
                const sheet = this.getCurrentSheet();
                let csvContent = "";
                for (let r = 0; r < this.rows; r++) {
                    let rowArr = [];
                    for (let c = 0; c < this.cols; c++) {
                        const cellKey = this.getCellKey(r, c);
                        let val = sheet.data[cellKey] || '';
                        if (val.includes(',') || val.includes('"')) {
                            val = `"${val.replace(/"/g, '""')}"`;
                        }
                        rowArr.push(val);
                    }
                    csvContent += rowArr.join(",") + "\n";
                }

                this.saveFile(`${sheet.name.toLowerCase().replace(/\s+/g, '_')}.csv`, csvContent, 'text/csv;charset=utf-8;');
            }

            buildAppHtml() {
                // Solo la hoja activa, con id nuevo para que cada copia tenga su propio almacenamiento
                const src = this.getCurrentSheet();
                const copia = JSON.parse(JSON.stringify(src));
                copia.id = 'compartida_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
                const payload = JSON.stringify(copia).replace(/</g, '\\u003c');

                // App completa, sin el DOM renderizado ni payloads previos (todo vía DOM, sin regex sobre el código)
                const clone = document.documentElement.cloneNode(true);
                const tabla = clone.querySelector('#spreadsheet-table');
                if (tabla) tabla.innerHTML = '';
                const modal = clone.querySelector('#custom-modal');
                if (modal) modal.classList.add('hidden');
                const previo = clone.querySelector('#hoja-compartida');
                if (previo) previo.remove();
                const tag = document.createElement('script');
                tag.id = 'hoja-compartida';
                tag.textContent = 'window.__HOJA_ACTIVA__=' + payload + ';';
                clone.querySelector('head').insertBefore(tag, clone.querySelector('head').firstChild);
                const html = '<!DOCTYPE html>\n' + clone.outerHTML;
                return html;
            }

            async shareAppCopy() {
                document.getElementById('custom-modal').classList.add('hidden');
                const html = this.buildAppHtml();
                const name = `telarh_${this.getCurrentSheet().name.replace(/\s+/g, '_')}.html`;

                // Android abre su hoja de compartir con el archivo adjunto
                const tipos = ['text/html', 'text/plain'];
                for (const tipo of tipos) {
                    const file = new File([html], name, { type: tipo });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({ title: 'TELARH', files: [file] });
                            return;
                        } catch (err) {
                            if (err.name === 'AbortError') return;
                        }
                    }
                }
                this.fallbackDownloadHtml(html);
            }

            async fallbackDownloadHtml(htmlContent) {
                await this.saveFile(`telarh_${this.getCurrentSheet().name.replace(/\s+/g, '_')}.html`, htmlContent, 'text/html');
            }

            fallbackShareText(text) {
                if (navigator.share) {
                    navigator.share({
                        title: 'Resumen Hoja de Cálculo',
                        text: text
                    }).catch(() => {});
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        showModal("¡Copiado!", "Los datos se han copiado al portapapeles.");
                    } catch (err) {
                        showModal("Aviso", "No se pudo compartir automáticamente.");
                    }
                    document.body.removeChild(textArea);
                }
            }
        }

        const gridApp = new ExcelGridApp(20, 40);
    </script>
</body>
</html>
